services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend:/app
      - bumblebee-data:/root/.bumblebee-gui
      # The scanner runs inside this container, so it can only read what is
      # mounted here. /scan is the one directory a scan can reach: point
      # BUMBLEBEE_SCAN_DIR at whatever you want to scan and use /scan as the
      # root in the UI. Read-only, because a scan never needs to write, and a
      # tool that reports on a tree should not be able to change it.
      - ${BUMBLEBEE_SCAN_DIR:-.}:/scan:ro
    environment:
      - BUMBLEBEE_DATA_DIR=/root/.bumblebee-gui

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      # The image installs its dependencies into /app/node_modules. Without a
      # volume here, the source mount above hides them behind an empty
      # directory on any machine that has not run npm install itself, and the
      # dev server exits with "vite: not found".
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  bumblebee-data:
  frontend-node-modules:
