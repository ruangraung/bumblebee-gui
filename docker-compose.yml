services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - bumblebee-data:/home/bumblebee/.bumblebee-gui
    environment:
      - BUMBLEBEE_DATA_DIR=/home/bumblebee/.bumblebee-gui

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  bumblebee-data:
