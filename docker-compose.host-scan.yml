# Scan a directory that lives on the host, not inside the container.
#
# By default the backend only sees itself, which is why a scan reports the
# Python packages its own image happens to contain. This override mounts one
# host directory read-only at /host, so a scan root of /host (or a path under
# it) reaches real project trees.
#
#   BUMBLEBEE_HOST_DIR=/home/you/projects \
#     docker compose -f docker-compose.yml -f docker-compose.host-scan.yml up -d backend
#
# The mount is read-only: the scanner only reads metadata, and nothing in the
# container can change what it sees. Everything under the mounted directory
# does become readable by the backend, which is bound to localhost, so mount
# the narrowest directory that answers your question.
services:
  backend:
    volumes:
      - ${BUMBLEBEE_HOST_DIR:?set BUMBLEBEE_HOST_DIR to the host directory you want to scan}:/host:ro
