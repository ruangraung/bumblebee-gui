# Catalogue pin freshness.
#
# The image ships upstream's threat_intel set from a commit pinned in
# Dockerfile.backend, with every file's sha256 listed in threat-intel.manifest.
# A pin that falls behind a published upstream release means a scan cannot
# report the campaigns published since, and a scan that reports nothing looks
# the same either way.
#
# Weekly, and on manual dispatch, scripts/check-catalogue-pin.py asks GitHub for
# upstream's latest release, compares it with the pinned commit, verifies each
# manifest digest against the file at that commit, and prints one report. The
# job reads only: contents: read, no secret beyond the default GITHUB_TOKEN,
# nothing written and no pull request opened. A failed run is the notification,
# and the response is a reviewed bump pull request.

name: Catalogue pin

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pin:
    name: Pinned catalogues are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check the pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-catalogue-pin.py
