# CI — supply-chain + secret + dependency-audit + build gates.
#
# Runs on push to main and every pull request.
#
# Layered security model:
#   - Socket (supply-chain + SAST)  -> malicious-package / code-level gate
#   - gitleaks (committed secrets)  -> credential-leak gate
#   - npm audit + pip-audit (CVEs)  -> known-vulnerability gates
#   - build (tsc + vite)            -> compile gate
#
# Note: `npm ci` here runs PLAIN npm (no Socket alias). Socket runs as a
# separate scan step, so the package manager is never wrapped — the aliasing
# approach previously caused process re-invocation / OOM. Docker at deploy
# time is an additional runtime blast-radius layer, NOT a substitute for
# these pre-execution gates.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    name: Socket supply-chain scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Socket Security
        uses: SocketDev/socket-basics@fe6259f624e25d30fddf87fd7c255545295cab94 # v2.0.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          socket_security_api_key: ${{ secrets.SOCKET_SECURITY_API_KEY }}

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend audit + install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: pip-audit (CVE gate)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: pytest (backend unit tests)
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend audit + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Dependency audit (CVE gate)
        run: |
          node scripts/audit-gate.mjs --self-test
          npm audit --json > audit-report.json || true
          node scripts/audit-gate.mjs audit-report.json
      - name: Unit tests (src/lib)
        run: npm run test
      - name: Type-check build configs
        run: npm run typecheck:config
      - name: Type-check + build
        run: npm run build

  # The Playwright suites existed for months without a runner, so they guarded
  # nothing. They run here against the built bundle served by `vite preview`,
  # with a real backend on 8001 driven by the scripted scanner in
  # scripts/fake-scanner.sh. The suite proved itself before it was made a
  # required check; it is one of the six the main ruleset enforces.
  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend dependencies (locked)
        working-directory: frontend
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start the API
        env:
          BUMBLEBEE_BINARY: ${{ github.workspace }}/scripts/fake-scanner.sh
          BUMBLEBEE_DATA_DIR: /tmp/bumblebee-gui-data
          BUMBLEBEE_THREAT_INTEL_DIR: /tmp/bumblebee-threat-intel
        run: |
          chmod +x scripts/fake-scanner.sh
          mkdir -p "$BUMBLEBEE_DATA_DIR" "$BUMBLEBEE_THREAT_INTEL_DIR"
          cd backend
          nohup python -m uvicorn bumblebee_gui.main:app --host 127.0.0.1 --port 8001 > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "The API did not become ready in 30s."
          cat /tmp/api.log
          exit 1
      - name: Build the frontend
        working-directory: frontend
        run: npm run build
      - name: Serve the built bundle
        working-directory: frontend
        run: |
          nohup npm run preview -- --port 5173 --strictPort > /tmp/preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "The preview server did not become ready in 30s."
          cat /tmp/preview.log
          exit 1
      - name: Playwright
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:5173
          API_URL: http://127.0.0.1:8001
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
